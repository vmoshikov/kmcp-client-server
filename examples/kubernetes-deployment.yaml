apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-operator
  labels:
    app: kagent-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kagent-operator
  template:
    metadata:
      labels:
        app: kagent-operator
    spec:
      containers:
      - name: kagent-operator
        image: kagent-operator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: MCP_SERVER_URL
          value: "http://mcp-server:3000/mcp"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-operator
  labels:
    app: kagent-operator
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: kagent-operator
